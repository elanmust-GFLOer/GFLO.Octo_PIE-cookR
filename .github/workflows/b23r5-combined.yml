name: B2.3-R5 Combined Security Evidence
on:
  pull_request:
    paths: ['b23r6a/**','b22/**','b23/**','b23r1/**','b23r2/**','b23r3/**','b23r4/**','b23r5/**','.github/workflows/b23r5-combined.yml']
  push:
    branches: ['feature/b23r5-operational-quarantine-gate']
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      B22_DISPOSABLE_ACK: 'YES'
      B23_DISPOSABLE_ACK: 'YES'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run provenance
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          psql --version
          python3 --version
      - run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r b23r6a/requirements.lock
      - name: Create disposable databases
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE b2test_r4_baseline;'
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE b2test_r4_transition;'
      - name: Execute R5 combined invariant and race suites
        run: bash b23r5/tests/run_combined_verified.sh

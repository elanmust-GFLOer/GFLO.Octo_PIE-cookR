name: IB-03E Trusted admission lab and boundary preflight
on:
  pull_request:
    paths: ['pilots/ib03e/**','.github/workflows/ib03e-admission.yml']
  push:
    branches: ['feature/ib03b-octopass-reader-isolated-20261025']
    paths: ['pilots/ib03e/**','.github/workflows/ib03e-admission.yml']
permissions: {contents: read}
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: cookr, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: elanmust-GFLOer/GFLO.Octo_PIE-cookR
          ref: 1ea68bc5b796901e5f652b6580c0584236ba2c5f
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Verify immutable lock and install
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git hash-object package-lock.json)" = "61e8a5ede9ad9031fdc58424cefb0fc442e3d9b3"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute EOA admission composition tests
        run: |
          set -euo pipefail
          mkdir -p harness/pilots/ib03d harness/pilots/ib03e
          cp cookr/pilots/ib03d/siwe-core.mjs cookr/pilots/ib03d/siwe-parser.mjs harness/pilots/ib03d/
          cp cookr/pilots/ib03e/admission.mjs cookr/pilots/ib03e/admission.test.mjs harness/pilots/ib03e/
          cd harness
          node --test pilots/ib03e/admission.test.mjs

name: IB-03Z-R1A F01 RED then GREEN Finality
on:
  push:
    branches: ['feature/ib03b-octopass-reader-isolated-20261025']
    paths: ['pilots/ib03z-r1a/**','.github/workflows/ib03z-r1a-finality.yml','pilots/ib03x/pinned.mjs','pilots/ib03z/provenance.mjs']
  pull_request:
    paths: ['pilots/ib03z-r1a/**','.github/workflows/ib03z-r1a-finality.yml','pilots/ib03x/pinned.mjs','pilots/ib03z/provenance.mjs']
permissions: {contents: read}
jobs:
  finality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: cookr,persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {repository: elanmust-GFLOer/GFLO.Octo_PIE-cookR,ref: 1ea68bc5b796901e5f652b6580c0584236ba2c5f,path: harness,persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: |
          cd harness
          test "$(git hash-object package-lock.json)" = "61e8a5ede9ad9031fdc58424cefb0fc442e3d9b3"
          npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          mkdir -p harness/pilots/ib03x harness/pilots/ib03z harness/pilots/ib03z-r1a
          cp cookr/pilots/ib03x/pinned.mjs harness/pilots/ib03x/
          cp cookr/pilots/ib03z/provenance.mjs harness/pilots/ib03z/
          cp cookr/pilots/ib03z-r1a/*.mjs harness/pilots/ib03z-r1a/
          cd harness
          node pilots/ib03z-r1a/red.test.mjs

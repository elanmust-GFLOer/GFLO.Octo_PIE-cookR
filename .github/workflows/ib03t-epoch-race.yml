name: IB-03T Signed Epoch and Two-Issuer Session Race
on:
  pull_request:
    paths: ['pilots/ib03t/**','.github/workflows/ib03t-epoch-race.yml']
  push:
    branches: ['feature/ib03b-octopass-reader-isolated-20261025']
    paths: ['pilots/ib03t/**','.github/workflows/ib03t-epoch-race.yml']
permissions: {contents: read}
jobs:
  issuer-race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test_only_password,POSTGRES_USER: gflo_test,POSTGRES_DB: gflo_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gflo_test -d gflo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env: {PGHOST: '127.0.0.1',PGPORT: '5432',PGUSER: gflo_test,PGPASSWORD: test_only_password,PGDATABASE: gflo_test}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: cookr,persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: elanmust-GFLOer/GFLO.Octo_PIE-cookR
          ref: 1ea68bc5b796901e5f652b6580c0584236ba2c5f
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          cd harness
          test "$(git hash-object package-lock.json)" = "61e8a5ede9ad9031fdc58424cefb0fc442e3d9b3"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Disposable nonce, wallet, context and issuer DB baseline
        working-directory: cookr
        run: |
          set -euo pipefail
          for f in pilots/ib03d/ledger.sql pilots/ib03d/issuance-fence.sql pilots/ib03f/roles.sql pilots/ib03g/role-split.sql pilots/ib03h/attestation.sql pilots/ib03j/asymmetric-receipt.sql pilots/ib03k/enforcement.sql pilots/ib03l/atomic.sql pilots/ib03n/context.sql pilots/ib03o/atomic-context.sql pilots/ib03p/issuer-role.sql pilots/ib03r/replay.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null
          done
      - name: Create issuer Unix UID and ephemeral MAC key
        working-directory: cookr
        run: bash pilots/ib03p/key-setup.sh
      - name: Two concurrent issuer workers, signed epoch and atomic session
        run: |
          mkdir -p harness/pilots/ib03d harness/pilots/ib03m harness/pilots/ib03o harness/pilots/ib03p harness/pilots/ib03q harness/pilots/ib03t
          cp cookr/pilots/ib03d/siwe-core.mjs cookr/pilots/ib03d/siwe-parser.mjs harness/pilots/ib03d/
          cp cookr/pilots/ib03m/trust-chain.mjs harness/pilots/ib03m/
          cp cookr/pilots/ib03o/admission.mjs harness/pilots/ib03o/
          cp cookr/pilots/ib03p/issuer.mjs harness/pilots/ib03p/
          cp cookr/pilots/ib03q/request-auth.mjs harness/pilots/ib03q/
          cp cookr/pilots/ib03t/*.mjs harness/pilots/ib03t/
          sudo chmod o+x /home/runner /home/runner/work /home/runner/work/GFLO.Octo_PIE-cookR /home/runner/work/GFLO.Octo_PIE-cookR/GFLO.Octo_PIE-cookR
          sudo chmod -R o+rX harness
          cd harness
          node pilots/ib03t/epoch-race.test.mjs

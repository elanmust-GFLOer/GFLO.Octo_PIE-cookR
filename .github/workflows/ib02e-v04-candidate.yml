name: IB-02E V04 candidate-specific EVM gate
on:
  pull_request:
    paths:
      - 'contracts/XPPolicyV04.sol'
      - 'contracts/GFLOSourceBoundAttestorV01.sol'
      - 'scripts/ib02e-v04-candidate-evm.mjs'
      - 'tests/ib02d-v04-source.test.mjs'
      - '.github/workflows/ib02e-v04-candidate.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  candidate-evm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: cookr
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: elanmust-GFLOer/gflo-pie
          ref: dbd02d3f1ffd31abff3bda9caaa9852ee7cecf5c
          path: gflo-pie
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify pinned PIE fixture SHA and lock
        working-directory: gflo-pie
        run: |
          set -euo pipefail
          printf '%s\n' \
            'c2442cda19e133417e38ff8b01e27c4ab73b3c2d contracts/PIECoreIgnitionV01.sol' \
            'd5d62c48db396aa39d6f1d481d6f27f36422cfe2 contracts/TrustedXPSourceRegistryV02.sol' \
            'd9015e7defe1aed3fab05eb88647693ccb1c8f41 contracts/GFLOIgnitionV01.sol' \
            'cbd69a5b0b80eea43eab1f9218b69666cf973d69 contracts/GFLOFixedSupplyV01.sol' \
            'e10a4ae3a907b0f059e9b57f09b7b29dbb12eac3 contracts/EffectiveTierGateV01.sol' |
            while read -r expected file; do
              test "$(git hash-object "$file")" = "$expected"
            done
      - name: Install pinned harness
        working-directory: cookr
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Candidate-specific EVM — 26 scenarios
        working-directory: cookr
        env:
          GFLO_PIE_ROOT: ${{ github.workspace }}/gflo-pie
          SAFE_ARTIFACTS_ROOT: ${{ github.workspace }}/cookr/node_modules/@safe-global/safe-smart-account/build/artifacts/contracts
        run: node scripts/ib02e-v04-candidate-evm.mjs
      - name: Existing 14 signed EVM regressions
        working-directory: cookr
        env:
          GFLO_PIE_ROOT: ${{ github.workspace }}/gflo-pie
          SAFE_ARTIFACTS_ROOT: ${{ github.workspace }}/cookr/node_modules/@safe-global/safe-smart-account/build/artifacts/contracts
        run: node scripts/rt6d7-issuer-rotation-evm.mjs

name: AR01 V05 Signed EVM Red Team
on:
  push:
    branches:
      - audit/ar01-contract-inventory-20261017
    paths:
      - '.github/workflows/ar01-v05-signed-evm.yml'
      - 'scripts/ar01-v05-signed-evm.mjs'
      - 'contracts/XPPolicyV05MultiSource.sol'
      - '_evm_deps/package.json'
      - '_evm_deps/package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-evm-v05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout PIE
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: elanmust-GFLOer/gflo-pie
          ref: dbd02d3f1ffd31abff3bda9caaa9852ee7cecf5c
          path: _pie
          persist-credentials: false
      - name: Checkout legacy GasFeeLoop
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: elanmust-GFLOer/GasFeeLoop-
          ref: 16f5e5aaa52d8022d33cee46cdcbba4e5e49fa7c
          path: _gas
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Record exact sources
        run: |
          git rev-parse HEAD
          git -C _pie rev-parse HEAD
          git -C _gas rev-parse HEAD
          node --version
      - name: Assert pinned upstream revisions
        run: |
          test "$(git -C _pie rev-parse HEAD)" = "dbd02d3f1ffd31abff3bda9caaa9852ee7cecf5c"
          test "$(git -C _gas rev-parse HEAD)" = "16f5e5aaa52d8022d33cee46cdcbba4e5e49fa7c"
      - name: Install isolated EVM fixture dependencies
        run: |
          mkdir -p evidence
          cd _evm_deps
          if test -f package-lock.json; then
            npm ci --ignore-scripts --no-audit --no-fund
            echo "dependency_mode=LOCKED_NPM_CI" >> "$GITHUB_ENV"
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=true
            echo "dependency_mode=BOOTSTRAP_LOCK_PENDING_REVIEW" >> "$GITHUB_ENV"
          fi
          npm ls --depth=0 > "$GITHUB_WORKSPACE/evidence/npm-top-level.txt"
      - name: Prepare isolated fixture paths
        run: |
          mkdir -p "$HOME/gflo-pie" "$HOME/GasFeeLoop-"
          cp "$GITHUB_WORKSPACE/_pie/package.json" "$HOME/gflo-pie/package.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.env.HOME+"/gflo-pie/package.json","utf8"))'
          ln -s "$GITHUB_WORKSPACE/_evm_deps/node_modules" "$HOME/gflo-pie/node_modules"
          ln -s "$GITHUB_WORKSPACE/_gas/contracts" "$HOME/GasFeeLoop-/contracts"
          git -C "$HOME/gflo-pie" init
          git -C "$HOME/gflo-pie" remote add origin "https://github.com/elanmust-GFLOer/gflo-pie.git"
          git -C "$HOME/gflo-pie" fetch --depth=1 origin dbd02d3f1ffd31abff3bda9caaa9852ee7cecf5c
          ln -s "$GITHUB_WORKSPACE/_evm_deps/node_modules" node_modules
      - name: Execute signed local EVM red team
        run: |
          mkdir -p evidence
          set -o pipefail
          node scripts/ar01-v05-signed-evm.mjs | tee evidence/v05-signed-evm.log
      - name: Capture evidence manifest
        if: always()
        run: |
          mkdir -p evidence
          {
            echo "integration_sha=$(git rev-parse HEAD)"
            echo "pie_sha=$(git -C _pie rev-parse HEAD)"
            echo "gas_sha=$(git -C _gas rev-parse HEAD)"
            echo "node_version=$(node --version)"
            echo "dependency_mode=${dependency_mode:-UNKNOWN}"
            echo "npm_version=$(npm --version)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "job_status=$GITHUB_JOB"
          } > evidence/manifest.txt
          if test -f evidence/v05-signed-evm.log; then sha256sum evidence/v05-signed-evm.log >> evidence/manifest.txt; fi
          if test -f _evm_deps/package-lock.json; then cp _evm_deps/package-lock.json evidence/package-lock.json; sha256sum _evm_deps/package-lock.json >> evidence/manifest.txt; fi
          sha256sum .github/workflows/ar01-v05-signed-evm.yml scripts/ar01-v05-signed-evm.mjs contracts/XPPolicyV05MultiSource.sol >> evidence/manifest.txt
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ar01-v05-signed-evm-evidence
          path: evidence/
          retention-days: 90

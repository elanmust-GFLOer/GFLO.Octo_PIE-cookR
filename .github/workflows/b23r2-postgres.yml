name: B2.3-R2 PostgreSQL independent connection races
on:
  pull_request:
    paths: ['b23r6a/**','b22/**','b23/**','b23r1/**','b23r2/**','.github/workflows/b23r2-postgres.yml']
  push:
    branches: ['feature/b23r2-concurrency-gate']
permissions:
  contents: read
jobs:
  pg16-races:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: b2test_octopass_r2}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d b2test_octopass_r2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: b2test_octopass_r2
      B23_DISPOSABLE_ACK: 'YES'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r b23r6a/requirements.lock
      - run: bash b23r2/tests/run_disposable_pg.sh

name: IB-03O Atomic Context and Issuer Gate
on:
  pull_request:
    paths: ['pilots/ib03o/**','.github/workflows/ib03o-context.yml']
  push:
    branches: ['feature/ib03b-octopass-reader-isolated-20261025']
    paths: ['pilots/ib03o/**','.github/workflows/ib03o-context.yml']
permissions: {contents: read}
jobs:
  atomic-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test_only_password,POSTGRES_USER: gflo_test,POSTGRES_DB: gflo_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gflo_test -d gflo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env: {PGHOST: '127.0.0.1',PGPORT: '5432',PGUSER: gflo_test,PGPASSWORD: test_only_password,PGDATABASE: gflo_test}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: cookr,persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: elanmust-GFLOer/GFLO.Octo_PIE-cookR
          ref: 1ea68bc5b796901e5f652b6580c0584236ba2c5f
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          cd harness
          test "$(git hash-object package-lock.json)" = "61e8a5ede9ad9031fdc58424cefb0fc442e3d9b3"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Start disposable PostgreSQL and sealed context function
        working-directory: cookr
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f pilots/ib03d/ledger.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03d/issuance-fence.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03f/roles.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03g/role-split.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03h/attestation.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03j/asymmetric-receipt.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03k/enforcement.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03l/atomic.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03n/context.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03o/atomic-context.sql
      - name: Real EOA signature, signer process and atomic context
        run: |
          mkdir -p harness/pilots/ib03d harness/pilots/ib03m harness/pilots/ib03o
          cp cookr/pilots/ib03d/siwe-core.mjs harness/pilots/ib03d/
          cp cookr/pilots/ib03m/trust-chain.mjs harness/pilots/ib03m/
          cp cookr/pilots/ib03o/*.mjs harness/pilots/ib03o/
          cd harness
          node pilots/ib03o/atomic-context.test.mjs

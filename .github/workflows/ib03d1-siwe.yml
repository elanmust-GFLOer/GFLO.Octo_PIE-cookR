name: IB-03D1 verifiable SIWE core (non-session lab)
on:
  pull_request:
    paths:
      - 'pilots/ib03d/**'
      - '.github/workflows/ib03d1-siwe.yml'
  push:
    branches: ['feature/ib03b-octopass-reader-isolated-20261025']
    paths:
      - 'pilots/ib03d/**'
      - '.github/workflows/ib03d1-siwe.yml'
permissions:
  contents: read
jobs:
  siwe-cryptography:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate test sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: cookr
          persist-credentials: false
      - name: Checkout immutable existing pinned npm harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: elanmust-GFLOer/GFLO.Octo_PIE-cookR
          ref: 1ea68bc5b796901e5f652b6580c0584236ba2c5f
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify pinned dependency input
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1ea68bc5b796901e5f652b6580c0584236ba2c5f"
          test "$(git hash-object package-lock.json)" = "61e8a5ede9ad9031fdc58424cefb0fc442e3d9b3"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute candidate tests against pinned harness dependencies
        run: |
          set -euo pipefail
          mkdir -p harness/pilots/ib03d
          cp cookr/pilots/ib03d/siwe-core.mjs cookr/pilots/ib03d/siwe-parser.mjs cookr/pilots/ib03d/siwe-core.test.mjs harness/pilots/ib03d/
          cd harness
          node --test pilots/ib03d/siwe-core.test.mjs

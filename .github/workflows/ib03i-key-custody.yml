name: IB-03I Attestation key custody and verifier isolation lab
on:
  pull_request:
    paths: ['pilots/ib03i/**','.github/workflows/ib03i-key-custody.yml']
  push:
    branches: ['feature/ib03b-octopass-reader-isolated-20261025']
    paths: ['pilots/ib03i/**','.github/workflows/ib03i-key-custody.yml']
permissions: {contents: read}
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: node --test pilots/ib03i/custody.test.mjs

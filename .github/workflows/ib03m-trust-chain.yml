name: IB-03M SIWE to attestation trust chain (lab)
on:
  pull_request:
    paths: ['pilots/ib03m/**','.github/workflows/ib03m-trust-chain.yml']
  push:
    branches: ['feature/ib03b-octopass-reader-isolated-20261025']
    paths: ['pilots/ib03m/**','.github/workflows/ib03m-trust-chain.yml']
permissions: {contents: read}
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test_only_password,POSTGRES_USER: gflo_test,POSTGRES_DB: gflo_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gflo_test -d gflo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env: {PGHOST: '127.0.0.1',PGPORT: '5432',PGUSER: gflo_test,PGPASSWORD: test_only_password,PGDATABASE: gflo_test}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: cookr,persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: elanmust-GFLOer/GFLO.Octo_PIE-cookR
          ref: 1ea68bc5b796901e5f652b6580c0584236ba2c5f
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          cd harness
          test "$(git hash-object package-lock.json)" = "61e8a5ede9ad9031fdc58424cefb0fc442e3d9b3"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Initialize PostgreSQL evidence scope
        working-directory: cookr
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f pilots/ib03d/ledger.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03d/issuance-fence.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03f/roles.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03g/role-split.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03h/attestation.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03j/asymmetric-receipt.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03k/enforcement.sql
          psql -v ON_ERROR_STOP=1 -f pilots/ib03l/atomic.sql
      - name: EIP191 signature to PostgreSQL issued session attack test
        run: |
          mkdir -p harness/pilots/ib03d harness/pilots/ib03m
          cp cookr/pilots/ib03d/siwe-core.mjs cookr/pilots/ib03d/siwe-parser.mjs harness/pilots/ib03d/
          cp cookr/pilots/ib03m/trust-chain.mjs cookr/pilots/ib03m/trust-chain.test.mjs harness/pilots/ib03m/
          cd harness
          node pilots/ib03m/trust-chain.test.mjs

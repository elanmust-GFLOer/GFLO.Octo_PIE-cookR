name: IB-03Z Sepolia Provenance (read-only)
on:
  push:
    branches: ['feature/ib03b-octopass-reader-isolated-20261025']
    paths: ['pilots/ib03z/**','.github/workflows/ib03z-provenance.yml']
  pull_request:
    paths: ['pilots/ib03z/**','.github/workflows/ib03z-provenance.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  offline-attack-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: cookr,persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {repository: elanmust-GFLOer/GFLO.Octo_PIE-cookR,ref: 1ea68bc5b796901e5f652b6580c0584236ba2c5f,path: harness,persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: |
          cd harness
          test "$(git hash-object package-lock.json)" = "61e8a5ede9ad9031fdc58424cefb0fc442e3d9b3"
          npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          mkdir -p harness/pilots/ib03z
          cp cookr/pilots/ib03z/*.mjs harness/pilots/ib03z/
          cd harness
          node pilots/ib03z/provenance.test.mjs
  live-two-provider-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: cookr,persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {repository: elanmust-GFLOer/GFLO.Octo_PIE-cookR,ref: 1ea68bc5b796901e5f652b6580c0584236ba2c5f,path: harness,persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: |
          cd harness
          test "$(git hash-object package-lock.json)" = "61e8a5ede9ad9031fdc58424cefb0fc442e3d9b3"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Query two public Sepolia providers — NO transactions
        run: |
          set -euo pipefail
          mkdir -p harness/pilots/ib03z
          cp cookr/pilots/ib03z/provenance.mjs harness/pilots/ib03z/
          cd harness
          IB03Z_REPORT="$GITHUB_WORKSPACE/ib03z-evidence.json" node pilots/ib03z/provenance.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: ib03z-sepolia-readonly-evidence,path: ib03z-evidence.json,if-no-files-found: warn}

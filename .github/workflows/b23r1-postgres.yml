name: B2.3-R1 restrictive PostgreSQL subgate
on:
  pull_request:
    paths: ['b23r6a/**','b22/**','b23/**','b23r1/**','.github/workflows/b23r1-postgres.yml']
  push:
    branches: ['feature/b23r1-role-audit-challenge']
    paths: ['b23r6a/**','b22/**','b23/**','b23r1/**','.github/workflows/b23r1-postgres.yml']
permissions:
  contents: read
jobs:
  b23r1-pg16:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: b2test_octopass_r1}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d b2test_octopass_r1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: b2test_octopass_r1
      B23_DISPOSABLE_ACK: 'YES'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash b23r1/tests/run_disposable_pg.sh

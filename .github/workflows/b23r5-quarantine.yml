name: B2.3-R5 operational role quarantine
on:
  pull_request:
    paths: ['b23r6a/**','b22/**','b23/**','b23r1/**','b23r3/**','b23r5/**','.github/workflows/b23r5-quarantine.yml']
  push:
    branches: ['feature/b23r5-operational-quarantine-gate']
permissions:
  contents: read
jobs:
  quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: b2test_r5_quarantine}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d b2test_r5_quarantine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: b2test_r5_quarantine
      B23_DISPOSABLE_ACK: 'YES'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash b23r5/tests/run_quarantine.sh

name: RT6D8 lockfile bootstrap (completed; one-time)
on:
  push:
    branches:
      - feature/rt6d8-finalize-revalidation
    paths:
      - '.github/workflows/rt6d8-lock-bootstrap.yml'
  workflow_dispatch:
jobs:
  commit-lock:
    if: github.repository == 'elanmust-GFLOer/GFLO.Octo_PIE-cookR' && github.ref == 'refs/heads/feature/rt6d8-finalize-revalidation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate lock only when missing
        run: |
          set -eu
          if test -f package-lock.json; then
            echo 'Lock already exists; refusing to regenerate'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(rt6d8): commit validated npm dependency lockfile'
          git push origin HEAD:feature/rt6d8-finalize-revalidation
